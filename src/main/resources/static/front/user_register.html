<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 - CakeShop</title>
    <link rel="stylesheet" href="/front/common-fix.css?v=19">
</head>
<body>
<div id="site-header"></div>
<main class="page">
    <form id="register-form" class="form-box">
        <h1 class="section-title">注册新用户</h1>
        <label>用户名</label>
        <input class="form-control" name="username" required>
        <label>邮箱</label>
        <input class="form-control" name="email" required>
        <label>密码</label>
        <input class="form-control" type="password" name="password" required>
        <label>收货人</label>
        <input class="form-control" name="name">
        <label>收货电话</label>
        <input class="form-control" name="phone">
        <label>收货地址</label>
        <input class="form-control" name="address">
        <button class="btn primary" type="submit">注册</button>
    </form>
</main>
<div id="site-footer"></div>
<script src="/front/common-fix.js?v=19"></script>
</body>
</html>
