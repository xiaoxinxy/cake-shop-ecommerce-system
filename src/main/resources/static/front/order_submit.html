<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>提交订单 - CakeShop</title>
    <link rel="stylesheet" href="/front/common-fix.css?v=19">
</head>
<body>
<div id="site-header"></div>
<main class="page">
    <h1 class="section-title">确认订单</h1>
    <div id="cart-list"></div>
    <div id="cart-total" class="cart-total"></div>
    <form id="order-form" class="form-box">
        <label>收货人</label>
        <input class="form-control" name="name" required>
        <label>收货电话</label>
        <input class="form-control" name="phone" required>
        <label>收货地址</label>
        <input class="form-control" name="address" required>
        <label>支付方式</label>
        <select class="form-control" name="paytype">
            <option value="1">支付宝沙箱</option>
            <option value="2">微信支付沙箱</option>
            <option value="3">货到付款</option>
        </select>
        <label>优惠券</label>
        <div class="coupon-row">
            <input class="form-control" name="couponCode" placeholder="输入 CAKE10 或 NEW20">
            <button id="coupon-preview-btn" class="btn gray" type="button">试算</button>
        </div>
        <div id="coupon-hint" class="coupon-hint">CAKE10：满 50 减 10；NEW20：满 100 减 20。</div>
        <button class="btn success" type="submit">提交订单</button>
    </form>
</main>
<div id="site-footer"></div>
<script src="/front/common-fix.js?v=19"></script>
</body>
</html>
