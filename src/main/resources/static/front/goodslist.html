<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品列表 - CakeShop</title>
    <link rel="stylesheet" href="/front/common-fix.css?v=19">
</head>
<body>
<div id="site-header"></div>
<main class="page">
    <h1 id="goods-title" class="section-title">全部系列</h1>
    <form id="goods-filter" class="filter-bar">
        <input class="form-control" name="keyword" placeholder="搜索商品名">
        <input class="form-control" name="minPrice" type="number" min="0" step="1" placeholder="最低价">
        <input class="form-control" name="maxPrice" type="number" min="0" step="1" placeholder="最高价">
        <select class="form-control" name="sort">
            <option value="">默认排序</option>
            <option value="priceAsc">价格从低到高</option>
            <option value="priceDesc">价格从高到低</option>
        </select>
        <button class="btn primary" type="submit">筛选</button>
        <a class="btn gray" href="/goods_list">重置</a>
    </form>
    <div id="goods-list" class="product-grid"></div>
    <div id="goods-pager" class="pager"></div>
</main>
<div id="site-footer"></div>
<script src="/front/common-fix.js?v=19"></script>
</body>
</html>
