<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CakeShop 首页</title>
    <link rel="stylesheet" href="/front/common-fix.css?v=19">
</head>
<body>
<div id="site-header"></div>
<main class="page">
    <section id="home-slider" class="hero-slider"></section>

    <section class="home-band band-hot">
        <div class="band-heading">
            <div>
                <h2 class="section-title">热销商品</h2>
                <p>大家最近都在买的蛋糕和甜点。</p>
            </div>
            <a href="/goodsrecommend_list?type=2">查看更多</a>
        </div>
        <div id="home-hot" class="product-grid"></div>
    </section>

    <section class="home-band band-new">
        <div class="band-heading">
            <div>
                <h2 class="section-title">新品推荐</h2>
                <p>新上架的口味，适合先尝鲜。</p>
            </div>
            <a href="/goodsrecommend_list?type=3">查看更多</a>
        </div>
        <div id="home-new" class="product-grid"></div>
    </section>

    <section class="home-band band-guess">
        <div class="band-heading">
            <div>
                <h2 class="section-title">猜你喜欢</h2>
                <p id="home-guess-note">根据你的历史订单和全站热销数据推荐。</p>
            </div>
            <a href="/goods_list">全部商品</a>
        </div>
        <div id="home-guess" class="product-grid"></div>
    </section>
</main>
<div id="site-footer"></div>
<script src="/front/common-fix.js?v=19"></script>
</body>
</html>
